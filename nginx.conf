# craft-suite-web: static hosting for the Craft App Suite web builds.
# Written from the apps' own HOSTING.md requirements: wasm MIME type,
# compression, long cache on content-hashed assets, revalidation on
# everything else. No SPA fallback: the apps probe for optional files and
# treat an HTML answer on an unknown path as a misconfiguration, so unknown
# paths 404.
#
# Big binaries exist only as .gz in the image (scripts/precompress.sh):
# gzip_static serves them as-is and gunzip inflates for clients that do
# not send Accept-Encoding: gzip.
#
# Runs in nginxinc/nginx-unprivileged (listens on 8080, non-root).

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;   # /photocraft -> /photocraft/ without baking in host:8080
    port_in_redirect off;

    gzip_static always;      # serve foo.wasm.gz for foo.wasm even if foo.wasm is absent
    gunzip      on;          # ...and inflate it for clients without gzip support
    gzip_vary   on;
    gzip        on;          # fallback for anything that has no .gz beside it
    gzip_types  application/wasm text/javascript application/javascript text/css application/json image/svg+xml text/plain;

    types {
        text/html                html;
        text/javascript          js mjs;
        application/wasm         wasm;
        text/css                 css;
        application/json         json;
        application/manifest+json webmanifest;
        image/svg+xml            svg;
        image/png                png;
        image/jpeg               jpg jpeg;
        image/webp               webp;
        image/x-icon             ico;
        font/ttf                 ttf;
        font/otf                 otf;
        font/woff2               woff2;
        text/plain               txt md;
    }
    default_type application/octet-stream;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed assets (trunk names them <app>-web-<hash>[_bg].wasm/.js):
    # safe to cache for a year. Not all apps hash their names, so this is
    # keyed on the hash, not the extension.
    # PhotoCraft 0.15+ ships its wasm gzipped and cut into hashed
    # app/<name>-<hash>.part-aa, -ab, ...: immutable too, and served byte for
    # byte (no .gz twin is made for them, and octet-stream is not in
    # gzip_types), because the page inflates them itself.
    location ~* "(-[0-9a-f]{8,}(_bg)?\.(wasm|js|mjs)|\.part-[a-z]+)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Unhashed binaries (lightcraft_web_bg.wasm, effectcraft_web.js, fonts):
    # let the browser keep them but revalidate (ETag / Last-Modified) on each
    # load, so an image bump is picked up.
    location ~* \.(wasm|js|mjs|otf|ttf|woff2)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Entry pages, and the small text files the apps read at start
    # (app/parts.txt, fonts/manifest.txt), revalidate on every load so a
    # redeploy is picked up.
    location ~* "(/index\.html|\.txt)$" {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        # Directory without trailing slash gets nginx's own 301 to the slash form.
        try_files $uri $uri/ =404;
    }
}
